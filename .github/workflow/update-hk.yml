name: Daily Update Kannada & Hindi M3U8

on:
  schedule:
    # 6:00 AM IST = 00:30 AM UTC
    - cron: "30 0 * * *"
  workflow_dispatch: # Actions tab madhun manual run karnyasathi

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge kan.m3u and hin.m3u into hk.m3u8
        run: |
          curl -fsSL "https://dearbulut.github.io/iptv/playlists/language/kan.m3u" > hk.m3u8
          echo "" >> hk.m3u8
          curl -fsSL "https://dearbulut.github.io/iptv/playlists/language/hin.m3u" | sed '1{/^#EXTM3U/d;}' >> hk.m3u8

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hk.m3u8
          if git diff --staged --quiet; then
            echo "No changes in hk.m3u8."
          else
            git commit -m "chore: update hk.m3u8 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
