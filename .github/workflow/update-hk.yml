name: Daily Update HK M3U8

on:
  schedule:
    # 6:15 AM IST = 00:45 AM UTC (kh.m3u8 nantar 15 min)
    - cron: "45 0 * * *"
  workflow_dispatch: # Actions tab madhun manual refresh karnyasathi

permissions:
  contents: write

jobs:
  update-hk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh and merge kan.m3u and hin.m3u into hk.m3u8
        run: |
          set -e
          curl -L --retry 3 --retry-delay 3 --max-time 30 -sS "https://dearbulut.github.io/iptv/playlists/language/kan.m3u" -o kan_part.m3u
          curl -L --retry 3 --retry-delay 3 --max-time 30 -sS "https://dearbulut.github.io/iptv/playlists/language/hin.m3u" -o hin_part.m3u

          {
            cat kan_part.m3u
            echo ""
            sed '1{/^#EXTM3U/d;}' hin_part.m3u
          } > hk.m3u8

          rm -f kan_part.m3u hin_part.m3u
          wc -l hk.m3u8

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hk.m3u8
          if git diff --staged --quiet; then
            echo "No changes in hk.m3u8 today."
          else
            git commit -m "chore: refresh hk.m3u8 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
