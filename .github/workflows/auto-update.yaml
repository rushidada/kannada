name: Auto Update Kannada & Hindi M3U8

on:
  schedule:
    - cron: '30 1 * * *' # दररोज सकाळी 7:00 IST (01:30 UTC) ला चालेल
  workflow_dispatch: # हवे तेव्हा मॅन्युअली चालवण्यासाठी

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge kan.m3u and hin.m3u into kh.m3u8
        run: |
          curl -sL "https://dearbulut.github.io/iptv/playlists/language/kan.m3u" > kh.m3u8
          echo "" >> kh.m3u8
          curl -sL "https://dearbulut.github.io/iptv/playlists/language/hin.m3u" | sed '1{/^#EXTM3U/d;}' >> kh.m3u8

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add kh.m3u8
          git diff --staged --quiet || (git commit -m "Auto update kh.m3u8" && git push)
