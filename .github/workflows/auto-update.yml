name: Daily Update Kannada & Hindi M3U8

on:
  schedule:
    # 6:00 AM IST = 00:30 AM UTC
    - cron: "30 0 * * *"
  workflow_dispatch: # Actions tab madhun manual run karnyasathi

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge kan.m3u and hin.m3u into kh.m3u8
        run: |
          curl -fsSL "https://iptv-org.github.io/iptv/languages/kan.m3u" > kh.m3u8
          echo "" >> kh.m3u8
          curl -fsSL "https://iptv-org.github.io/iptv/languages/hin.m3u" | sed '1{/^#EXTM3U/d;}' >> kh.m3u8

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kh.m3u8
          if git diff --staged --quiet; then
            echo "No changes in kh.m3u8."
          else
            git commit -m "chore: update kh.m3u8 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
